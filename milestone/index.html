<!DOCTYPE html>
<html lang="sv" dir="ltr">
<head>
<!--
  Milestone card for social media. Open with query params, e.g.:
    /milestone/?amount=5500000&mark=5500000&tier=500k&lang=sv
  Params: amount (total collected, SEK) · mark (milestone crossed, optional —
          used in the captions) · tier (500k|800k|1m|goal) ·
          lang (sv|ar) · goal (default 10000000)
  Layout adapts to screen: a fixed 1080×1080 square poster on wide screens,
  a reflowed vertical card on phones/tablets — screenshot either as-is.
  Below the card: ready-to-copy post captions (Swedish + Arabic) with
  hashtags — click "Kopiera" and paste into Instagram/Facebook/etc.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Alsalam Center — Insamlingsmilstolpe</title>
<script>
  // Read query params BEFORE first paint so the final state renders
  // immediately (no flash of the demo values).
  // Params: amount (total SEK) · tier (500k|800k|1m|goal) ·
  //         lang (sv|ar) · goal (default 10 000 000).
  (function () {
    var params = new URLSearchParams(location.search);
    function num(name, fallback) {
      var v = parseFloat(params.get(name));
      return isNaN(v) ? fallback : v;
    }
    var tiers = ['500k', '800k', '1m', 'goal'];
    var tier = tiers.indexOf(params.get('tier')) >= 0 ? params.get('tier') : '500k';
    var lang = params.get('lang') === 'ar' ? 'ar' : 'sv';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.dataset.tier = tier;
    window.CARD = {
      amount: num('amount', 5500000),
      mark: num('mark', 0),
      goal: num('goal', 10000000),
      tier: tier,
      lang: lang
    };
  })();
</script>
<style>
  :root {
    --neon: #3BF04B;
    --neon-light: #9DFF86;
    --paper: #FFFFFF;
    --ink: #123B2B;
    --muted-ink: #48675A;
    --white-strong: rgba(255, 255, 255, 0.96);
    --white-soft: rgba(255, 255, 255, 0.84);
    --white-faint: rgba(255, 255, 255, 0.5);
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: #0C1E16;
    color: var(--white-strong);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  html[lang="ar"] body {
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  }

  .card {
    position: relative;
    z-index: 0;
    width: 1080px;
    height: 1080px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding: 56px 64px 42px;
    margin: 0 auto;
    overflow: hidden;
    background: linear-gradient(135deg, #196F15 0%, #15546F 100%);
  }

  /* Building photo background — sits behind everything on the card.
     The overlay keeps the neon/white text readable over the photo;
     the card's own gradient remains as a fallback if the image fails. */
  .bg-photo {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: url('../img/building_pic.png') center / cover no-repeat;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, rgba(9, 38, 25, 0.76) 0%, rgba(12, 44, 60, 0.74) 100%);
  }

  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(58% 42% at 50% 36%, rgba(255, 255, 255, 0.16), transparent 72%);
    pointer-events: none;
  }

  /* ── Bottom bar (logo + name | QR + swish number) ───────────── */
  /* Wrapper around the in-flow card content. The logo and QR groups
     are pinned to the card's bottom corners (absolute), so they always
     sit at the bottom of the screenshot on both layouts. */
  .bottom-bar {
    display: block;
  }

  .brand-group {
    position: absolute;
    inset-inline-start: 64px;
    bottom: 22px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .logo-chip {
    background: var(--paper);
    border-radius: 20px;
    padding: 10px;
    display: block;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .logo-chip img {
    display: block;
    width: 96px;
    height: 96px;
  }

  .site-line {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--white-strong);
    direction: ltr;
  }

  .qr-group {
    position: absolute;
    inset-inline-end: 64px;
    bottom: 22px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .qr-chip {
    background: var(--paper);
    border-radius: 18px;
    padding: 10px;
    display: block;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .qr-chip img {
    display: block;
    width: 96px;
    height: 96px;
  }

  .swish-number {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--white-strong);
    direction: ltr;
    font-variant-numeric: tabular-nums;
  }

  /* ── Main content ───────────────────────────────────────────── */
  .salam {
    margin-top: 28px;
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    color: var(--neon-light);
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  /* ── Donut chart + numbers ──────────────────────────────────── */
  .content-row {
    margin-top: 18px;
    display: flex;
    justify-content: center;
  }

  .donut-wrap {
    position: relative;
    width: 380px;
    height: 380px;
    flex: none;
  }

  .donut {
    display: block;
    width: 380px;
    height: 380px;
  }

  /* Mirror the sweep direction for RTL (right-to-left progress). */
  html[dir="rtl"] .donut {
    transform: scaleX(-1);
  }

  .donut-track {
    stroke: rgba(255, 255, 255, 0.22);
  }

  .donut-value {
    stroke: #FFFFFF;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.5));
  }

  html[data-tier="1m"] .donut-value,
  html[data-tier="goal"] .donut-value {
    stroke: var(--neon);
    filter: drop-shadow(0 0 14px rgba(59, 240, 75, 0.5));
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .donut-pct {
    font-size: 82px;
    font-weight: 800;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  html[lang="ar"] .donut-pct {
    font-size: 68px;
  }

  .hero {
    margin-top: 14px;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--neon-light);
    text-shadow: 0 6px 26px rgba(0, 0, 0, 0.28);
    white-space: nowrap;
  }

  html[lang="ar"] .hero {
    font-size: 56px;
  }

  .hero-unit {
    font-size: 0.42em;
    font-weight: 700;
    margin-inline-start: 0.15em;
    color: inherit;
    opacity: 0.85;
  }

  .stat-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
    font-size: 25px;
    color: var(--white-strong);
    white-space: nowrap;
  }

  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex: none;
  }

  .dot-rest {
    background: rgba(255, 255, 255, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.55);
    box-sizing: border-box;
  }

  /* ── Motivation ─────────────────────────────────────────────── */
  .motivation {
    margin-top: 20px;
    font-size: 27px;
    line-height: 1.5;
    color: var(--white-soft);
    text-align: center;
    max-width: 900px;
    align-self: center;
  }

  /* ── Share captions (below the card — not part of the screenshot) ── */
  .caption-panel {
    max-width: 1080px;
    margin: 28px auto 56px;
    padding: 0 64px;
    box-sizing: border-box;
  }

  .caption-heading {
    margin: 0 0 16px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--neon-light);
  }

  .caption-grid {
    display: flex;
    gap: 24px;
  }

  .caption-card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 22px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    background: #123022;
  }

  .caption-lang {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }

  .caption-text {
    flex: 1;
    font-size: 16px;
    line-height: 1.6;
    color: #EAF2EC;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .copy-btn {
    align-self: flex-start;
    border: none;
    border-radius: 999px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(90deg, #196F15 0%, #15546F 100%);
    color: #FFFFFF;
  }

  .copy-btn:hover {
    filter: brightness(1.15);
  }

  .copy-btn.copied {
    background: var(--neon);
    color: #082B0C;
  }

  /* ── Mobile / tablet: reflow to a vertical card ─────────────── */
  @media (max-width: 1079px) {
    body {
      width: 100%;
      height: auto;
      min-height: 100vh;
      overflow: visible;
    }

    .card {
      width: 100%;
      height: auto;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 20px 160px;
    }

    .brand-group {
      inset-inline-start: 20px;
      bottom: 16px;
      gap: 8px;
    }

    .logo-chip {
      border-radius: 16px;
      padding: 8px;
    }

    .logo-chip img {
      width: 72px;
      height: 72px;
    }

    .site-line {
      font-size: 15px;
    }

    .qr-group {
      inset-inline-end: 20px;
      bottom: 16px;
    }

    .qr-chip {
      border-radius: 14px;
      padding: 8px;
    }

    .qr-chip img {
      width: 72px;
      height: 72px;
    }

    .swish-number {
      font-size: 15px;
    }

    .salam {
      margin-top: 22px;
      font-size: 24px;
    }

    .content-row {
      margin-top: 20px;
    }

    .donut-wrap,
    .donut {
      width: 240px;
      height: 240px;
    }

    .donut-pct {
      font-size: 42px;
    }

    html[lang="ar"] .donut-pct {
      font-size: 36px;
    }

    .stat-row {
      font-size: 16px;
      gap: 10px;
      white-space: normal;
      justify-content: center;
      text-align: center;
    }

    .hero {
      font-size: 38px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    html[lang="ar"] .hero {
      font-size: 30px;
    }

    .dot {
      width: 12px;
      height: 12px;
    }

    .dot-rest {
      border-width: 1.5px;
    }

    .motivation {
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.55;
      max-width: 100%;
    }

    .caption-panel {
      margin: 24px auto 40px;
      padding: 0 20px;
    }

    .caption-heading {
      margin-bottom: 12px;
      font-size: 18px;
    }

    .caption-grid {
      flex-direction: column;
      gap: 16px;
    }

    .caption-card {
      padding: 16px 18px;
    }

    .caption-text {
      font-size: 15px;
    }
  }
</style>
</head>

  <section class="caption-panel">
    <h2 class="caption-heading">Klart att dela — kopiera texten till ditt inlägg</h2>
    <div class="caption-grid">
      <div class="caption-card">
        <div class="caption-lang">Svenska</div>
        <div class="caption-text" id="captionSv"></div>
        <button class="copy-btn" id="copySv" type="button">Kopiera</button>
      </div>
      <div class="caption-card" dir="rtl">
        <div class="caption-lang">العربية</div>
        <div class="caption-text" id="captionAr"></div>
        <button class="copy-btn" id="copyAr" type="button">نسخ</button>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var C = window.CARD;
      var sv = C.lang === 'sv';

      function el(id) { return document.getElementById(id); }

      function formatAmount(n) {
        if (sv) {
          return new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 })
            .format(n).replace(/\s/g, ' ');
        }
        return new Intl.NumberFormat('ar-SA', { maximumFractionDigits: 0 }).format(n);
      }

      function formatMark(n) {
        var millions = n / 1000000;
        if (sv) return String(Math.round(millions * 10) / 10).replace('.', ',');
        return new Intl.NumberFormat('ar-SA', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }).format(millions);
      }

      function formatPct(p) {
        if (sv) return String(p).replace('.', ',');
        return new Intl.NumberFormat('ar-SA', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }).format(p);
      }

      var pct = Math.min(100, Math.round((C.amount / C.goal) * 1000) / 10);
      var tier = C.tier;

      var salamText, motivation;
      if (tier === 'goal') {
        salamText = sv ? 'Alhamdulillah! Målet är nått:' : 'الحمد لله! تحقق الهدف:';
        motivation = sv
          ? 'Alhamdulillah! Tack till varje givare, må Allah belöna er. Följ bygget på alsalamcenter.se'
          : 'الحمد لله! شكرًا لكل متبرع، جزاكم الله خيرًا. تابعوا البناء على alsalamcenter.se';
      } else if (tier === '1m') {
        salamText = sv ? 'Alhamdulillah! Vi har nått:' : 'الحمد لله! وصلنا إلى:';
        motivation = sv
          ? 'Alhamdulillah! Tack vare er generositet, fortsätt donera och följ vår resa till vår nya moské!'
          : 'الحمد لله! بفضل كرمكم، واصلوا التبرع وتابعوا رحلتنا إلى مسجدنا الجديد!';
      } else {
        salamText = sv ? 'Alhamdulillah! Vi har nått:' : 'الحمد لله! وصلنا إلى:';
        motivation = sv
          ? 'Fortsätt donera och följ vår resa till vår nya moské!'
          : 'واصلوا التبرع وتابعوا رحلتنا إلى مسجدنا الجديد!';
      }

      var remaining = Math.max(0, C.goal - C.amount);
      var circumference = 2 * Math.PI * 160;

      el('salam').textContent = salamText;
      el('heroAmount').textContent = formatAmount(C.amount);
      el('heroUnit').textContent = sv ? 'kr' : 'كرونة';
      el('donutValue').setAttribute('stroke-dasharray',
        (Math.max(0, Math.min(100, pct)) / 100 * circumference) + ' ' + circumference);
      el('donutPct').textContent = sv ? formatPct(pct) + ' %' : formatPct(pct) + '٪';
      el('remainingLine').textContent = sv
        ? 'Kvar: ' + formatAmount(remaining) + ' kr'
        : 'المتبقي: ' + formatAmount(remaining) + ' كرونة';
      el('motivation').textContent = motivation;

      // ── Share captions for social media (below the card) ──────
      var markLine = C.mark > 0 ? formatMark(C.mark) : null;

      function buildCaption(svLang) {
        var lines = [];
        var tags;
        if (svLang) {
          if (tier === 'goal') {
            lines.push('MÅLET ÄR NÅTT! 🎉 ' + formatMark(C.goal) + ' miljoner kronor insamlade till vår nya moské!');
            lines.push('Alhamdulillah — tack till varje givare, må Allah belöna er mångfaldigt.');
            lines.push('Följ bygget på alsalamcenter.se');
          } else if (tier === '1m') {
            lines.push(markLine
              ? 'ALHAMDULILLAH! 🎉 Vi har nått ' + markLine + ' miljoner kronor i insamlingen till vår nya moské!'
              : 'ALHAMDULILLAH! 🎉 Vi har samlat in ' + formatAmount(C.amount) + ' kr i insamlingen till vår nya moské!');
            lines.push('Nu är vi uppe i ' + formatPct(pct) + ' % av målet på ' + formatAmount(C.goal) + ' kr — tack till varje givare, må Allah belöna er.');
            lines.push('Hjälp oss sprida ordet — dela, donera och följ vår resa på alsalamcenter.se');
          } else {
            lines.push(markLine
              ? 'Alhamdulillah! Vi har nått ' + markLine + ' miljoner kr i insamlingen till vår nya moské! 💚'
              : 'Alhamdulillah! Vi har samlat in ' + formatAmount(C.amount) + ' kr till vår nya moské! 💚');
            lines.push('Totalt: ' + formatAmount(C.amount) + ' kr — ' + formatPct(pct) + ' % av målet på ' + formatAmount(C.goal) + ' kr.');
            lines.push('Varje krona för oss närmare vår egen moské. Vill du vara med? Swisha valfritt belopp till 123 5000 559 eller ge på alsalamcenter.se');
          }
          tags = '#AlsalamCenter #Helsingborg #Moské #Islam #Sverige #Insamling #Donera #Swish #Sadaqah #Alhamdulillah';
        } else {
          if (tier === 'goal') {
            lines.push('تحقق الهدف! 🎉 جمعنا ' + formatMark(C.goal) + ' ملايين كرونة لبناء مسجدنا الجديد!');
            lines.push('الحمد لله — شكرًا لكل متبرع، جزاكم الله خيرًا الجزاء.');
            lines.push('تابعوا البناء على alsalamcenter.se');
          } else if (tier === '1m') {
            lines.push(markLine
              ? 'الحمد لله! 🎉 وصلنا إلى ' + markLine + ' ملايين كرونة في حملة جمع التبرعات لبناء مسجدنا الجديد!'
              : 'الحمد لله! 🎉 جمعنا ' + formatAmount(C.amount) + ' كرونة في حملة جمع التبرعات لبناء مسجدنا الجديد!');
            lines.push('وصلنا إلى ' + formatPct(pct) + '٪ من هدفنا البالغ ' + formatAmount(C.goal) + ' كرونة — شكرًا لكل متبرع، جزاكم الله خيرًا.');
            lines.push('ساعدونا في نشر الخبر — شاركوا وتبرعوا وتابعوا رحلتنا على alsalamcenter.se');
          } else {
            lines.push(markLine
              ? 'الحمد لله! وصلنا إلى ' + markLine + ' ملايين كرونة في حملة جمع التبرعات لبناء مسجدنا الجديد! 💚'
              : 'الحمد لله! جمعنا ' + formatAmount(C.amount) + ' كرونة لبناء مسجدنا الجديد! 💚');
            lines.push('جمعنا حتى الآن ' + formatAmount(C.amount) + ' كرونة — ' + formatPct(pct) + '٪ من هدفنا البالغ ' + formatAmount(C.goal) + ' كرونة.');
            lines.push('كل كرونة تقرّبنا من مسجدنا الخاص. تريد المشاركة؟ تبرع عبر Swish على الرقم 123 5000 559 أو عبر alsalamcenter.se');
          }
          tags = '#مركز_السلام #هلسينغبوري #مسجد #الإسلام #السويد #صدقة #تبرع #الحمد_لله #ما_شاء_الله';
        }
        lines.push('');
        lines.push(tags);
        return lines.join('\n');
      }

      el('captionSv').textContent = buildCaption(true);
      el('captionAr').textContent = buildCaption(false);

      setupCopyButton('copySv', 'captionSv', 'Kopiera');
      setupCopyButton('copyAr', 'captionAr', 'نسخ');

      function setupCopyButton(btnId, textId, label) {
        var btn = el(btnId);
        btn.addEventListener('click', function () {
          var text = el(textId).textContent;
          function markDone() {
            btn.classList.add('copied');
            btn.textContent = label + ' ✓';
            setTimeout(function () {
              btn.classList.remove('copied');
              btn.textContent = label;
            }, 1800);
          }
          function selectText() {
            var node = el(textId);
            var range = document.createRange();
            range.selectNodeContents(node);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(markDone, function () {
              selectText();
              markDone();
            });
          } else {
            selectText();
            markDone();
          }
        });
      }
    })();
  </script>
